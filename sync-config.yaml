# Advanced configuration with file exclusions and renaming
.github:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
  excludeFiles:
    - workflows
    - workflows-v2
    - nodejs.version

.github/workflows-v2:
  projects:
    - NextJs/NextJs15
  asName: workflows

.github/nodejs.version:
  projects:
    - startetNpmPackage/node
    - node

.github/workflows:
  projects:
    - startetNpmPackage/node
    - node

.husky:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
  excludeFiles:
    - lint-staged-with-style.config.json
    - lint-staged.config.json

.husky/lint-staged.config.json:
  projects:
    - startetNpmPackage/node
    - node

.husky/lint-staged-with-style.config.json:
  projects:
    - NextJs/NextJs15
  asName: lint-staged.config.json
