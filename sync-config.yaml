.github:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
  excludeFiles:
    - workflows

.github/workflows:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
  excludeFiles:
    - ci.yml

.husky:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
  excludeFiles:
    - lint-staged-with-style.config.json
    - lint-staged.config.json

.husky/lint-staged.config.json:
  projects:
    - startetNpmPackage/node
    - node

.husky/lint-staged-with-style.config.json:
  projects:
    - NextJs/NextJs15
  asName: lint-staged.config.json

.vscode:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

"[next]":
  projects:
    - NextJs/NextJs15
  copyToRoot: true

'[node]':
  projects:
    - startetNpmPackage/node
    - node
  copyToRoot: true

'[nestjs]':
  projects:
    - nestjs
  copyToRoot: true

docs:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
    - nestjs
  excludeFiles:
    - npm.png
    - "[web]"
    - "[npm]"

docs/[web]/HowToAutoDeploy.md:
  projects:
    - NextJs/NextJs15
  asName: ../HowToAutoDeploy.md

docs/[npm]/HowToAutoDeploy.md:
  projects:
    - startetNpmPackage/node
    - node
    - nestjs
  asName: ../HowToAutoDeploy.md

tools:
  projects:
    - NextJs/NextJs15
    - startetNpmPackage/node
    - node
    - nestjs
  excludeFiles:
    - transform-browser-list
    - addDependency.js
    - addModuleType.js

tools/transform-browser-list:
  projects:
    - NextJs/NextJs15

tools/addDependency.js:
  projects:
    - startetNpmPackage/node
    - node
    - nestjs

tools/addModuleType.js:
  projects:
    - startetNpmPackage/node
    - node
    - nestjs

.commitlintrc.js:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.cursorignore:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.editorconfig:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.gitattributes:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.npmrc:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.nvmrc:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.prettierignore:
  - startetNpmPackage/node
  - node
  - nestjs

.quokka:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

.releaserc.js:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

LICENSE:
  - NextJs/NextJs15
  - startetNpmPackage/node
  - node
  - nestjs

prettier.config.js:
